name: Verify CuraFit API engines
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run audit:matrix
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-matrix
          path: |
            outputs/audit-matrix.json
            outputs/benchmark-report.json
