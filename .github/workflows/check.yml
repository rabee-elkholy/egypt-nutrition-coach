name: Verify coaching engines
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Verify onboarding, coaching, network recovery and simulation in the browser
        run: |
          npm run dev > /tmp/coach-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/v1/health; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:browser:release
      - run: npm run audit:matrix
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-matrix
          path: |
            outputs/audit-matrix.json
            outputs/benchmark-report.json
