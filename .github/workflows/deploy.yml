name: Deploy CuraFit Worker
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Cloudflare deployment secret
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NOTICE: CLOUDFLARE_API_TOKEN secret is not configured in GitHub Actions; skipping auto-deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies and build
        if: steps.cf_check.outputs.enabled == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy Cloud Dev (dev branch)
        if: steps.cf_check.outputs.enabled == 'true' && github.ref_name == 'dev'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply curafit-db-dev --remote --config wrangler.jsonc --env dev
          npx wrangler deploy --config wrangler.jsonc --env dev

      - name: Deploy Production (main branch)
        if: steps.cf_check.outputs.enabled == 'true' && github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply egypt-nutrition-coaching --remote --config wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc
