                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Explicit visual_progress_analysis consent required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /v1/progress/photos/analyses:
    get:
      operationId: listPhotoAnalyses
      summary: List saved Specialist Visual Difference Analyses (always accessible even after Pro downgrade)
      parameters:
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated visual difference analyses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /v1/progress/photos/analyses/{analysisId}:
    delete:
      operationId: deletePhotoAnalysis
      summary: Delete a saved Specialist Visual Difference Analysis (always accessible even after Pro downgrade)
      parameters:
        - name: analysisId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Analysis deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AnonymousCookieAuth:
      type: apiKey
      in: cookie
      name: coach_uid
  parameters:
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    FromDateQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    ToDateQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    ValidationError:
      description: Validation or domain rule error (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Unauthenticated or token expired/revoked (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Resource not found or not owned by caller (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Optimistic concurrency revision mismatch or idempotency key conflict (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLargeError:
      description: Request body > 40 KB or account capacity reached (413)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimitedError:
      description: Per-user rate limit exceeded (429)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CoachingBriefResponse:
      type: object
      required: [apiVersion, viewKind, date, timezone, revision, generatedAt, requiresOnboarding, notes, requestId]
      properties:
        apiVersion:
          type: string
          const: "1"
        viewKind:
          type: string
          const: on_demand_coaching_brief
        date:
          type: string
          format: date
        timezone:
          type: string
        revision:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
        requiresOnboarding:
          type: boolean
        requestId:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/CoachingBriefNote"
    CoachingBriefNote:
      type: object
      required: [id, role, key, priority, text, action, basedOnRevision, relatedPlanId, status, deliveryStatus, renderingStatus]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [nutrition, training, followup]
        key:
          type: string
        code:
          type: string
          description: Canonical coaching code from contracts/coaching-codes.json
        params:
          type: object
          additionalProperties: true
        priority:
          type: string
          enum: [normal, attention, urgent]
        text:
          type: string
        action:
          type: string
        actionTarget:
          type: string
          enum: [recovery, food, feedback, workout, water, review]
          description: Optional navigation destination for the in-app next step; never performs a write.
        basedOnRevision:
          type: integer
          minimum: 0
        relatedPlanId:
          type: [string, "null"]
        status:
          type: string
          const: GENERATED
        deliveryStatus:
          type: string
          const: NOT_MEASURED
        caseId:
          type: string
          description: Optional related persisted coaching agreement ID
        renderingStatus:
          type: string
          const: NOT_MEASURED
    AccountDeletionResponse:
      type: object
      required: [deleted, userId, deletedAt, tablesCleared, namespacesCleared]
      properties:
        deleted:
          type: boolean
          const: true
        userId:
          type: string
        deletedAt:
          type: string
          format: date-time
        tablesCleared:
          type: integer
          minimum: 1
        namespacesCleared:
          type: integer
          minimum: 1
    SuccessMeta:
      type: object
      required: [requestId, serverTime]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        revision:
          type: integer
    SuccessEnvelope:
      type: object
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    ErrorEnvelope:
      type: object
      required: [ok, error, meta]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, params, fieldErrors, retryable]
          properties:
            code:
              type: string
              description: Stable machine-readable error code (`contracts/error-codes.json`) for client localization.
            message:
              type: string
              description: English fallback error message (zero Arabic characters).
            params:
              type: object
              additionalProperties: true
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    CapabilitiesResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - apiVersion
                - schemaVersion
                - engineVersion
                - coachingCodesVersion
                - catalogVersion
                - serverTime
                - requestId
                - auth
                - features
                - deferredFeatures
              properties:
                apiVersion:
                  type: string
                schemaVersion:
                  type: integer
                engineVersion:
                  type: string
                coachingCodesVersion:
                  type: string
                catalogVersion:
                  type: string
                foodCatalogVersion:
                  type: string
                serverTime:
                  type: string
                  format: date-time
                requestId:
                  type: string
                minAndroidVersion:
                  type: string
                minIosVersion:
                  type: string
                latestAndroidVersion:
                  type: string
                latestIosVersion:
                  type: string
                maintenanceMessage:
                  type: [string, "null"]
                minSupportedVersion:
                  type: object
                  properties:
                    android: { type: string }
                    ios: { type: string }
                maintenanceMode:
                  type: object
                  properties:
                    active: { type: boolean }
                    message: { type: [string, "null"] }
                auth:
                  type: object
                  properties:
                    provider: { type: string }
                    configured: { type: boolean }
                features:
                  type: array
                  items:
                    type: string
                deferredFeatures:
                  type: array
                  items:
                    type: string
                supportedRegions:
                  type: array
                  items:
                    type: string
                    enum: [egypt, gulf, levant, maghreb]
                detectedGeo:
                  type: object
                  properties:
                    countryCode:
                      type: ["string", "null"]
                    region:
                      type: ["string", "null"]
                      enum: [egypt, gulf, levant, maghreb, null]
                    source:
                      type: string
                      enum: [cloudflare_edge_ip, unknown]
    BootstrapResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - schemaVersion
                - revision
                - serverNow
                - serverDate
                - timezone
                - profile
                - preferences
                - eligibility
                - onboarding
                - serviceTrack
                - todaySummary
              properties:
                schemaVersion:
                  type: integer
                revision:
                  type: integer
                serverNow:
                  type: string
                  format: date-time
                serverDate:
                  type: string
                  format: date
                timezone:
                  type: string
                profile:
                  type: [object, "null"]
                  description: Hydrated user profile including canonical `birthDate` (`YYYY-MM-DD`, when set), live birthday-rollover `age` (`18..95`), `seniorMode`, `unitSystem`/`unit_system`, `region`/`region_id`, and optional short-lived `avatarUrl`.
                preferences:
                  type: [object, "null"]
                eligibility:
                  type: object
                  description: Eligibility status with additive `eligibilityReasons` and `eligibilityReasonCodes`.
                calibrationMetadata:
                  type: [object, "null"]
                  description: Structured specialist calibration summary (`calibrationReasons`, `adjustedCalories`, `previousCalories`, `calorieDelta`, `adjustedMacros`, `protectedJoints`, `activeProteinPillars`).
                specialistHighlights:
                  type: array
                  description: Priority-ranked list (up to 6 items) of concrete clinical, nutritional, training, synergy, and hydration actions taken by the CuraFit Specialist Team (`id`, `domain`, `priority`, `code`, `params`, `message`).
                  items:
                    type: object
                    required: [id, domain, priority, code, params, message]
                    properties:
                      id: { type: string }
                      domain: { type: string, enum: [clinical, nutrition, training, synergy, hydration] }
                      priority: { type: integer }
                      code: { type: string }
                      params: { type: array, items: {} }
                      message: { type: string }
                onboarding:
                  type: [object, "null"]
                onboardingCompleted:
                  type: boolean
                daysSinceStart:
                  type: integer
                  description: Whole days elapsed since journeyStartedOn (or nutritionContextStartedOn).
                batchPrepMode:
                  type: boolean
                  description: Whether batch meal preparation preference is enabled.
                discreetMode:
                  type: boolean
                  description: Whether discreet cycle awareness display mode is enabled.
                proImpact:
                  type: object
                  description: Aggregate longitudinal progress metrics (streakDays, foodDaysLogged, workoutsCompleted, weightsLogged, plansGenerated, adaptationsAccepted).
                serviceTrack:
                  type: [string, "null"]
                consents:
                  type: array
                  items: { type: object }
                cycleState:
                  type: [object, "null"]
                coachingPause:
                  type: [object, "null"]
                todayWorkoutOverride:
                  type: [object, "null"]
                newlyUnlockedBadges:
                  type: array
                  items: { type: object }
                activeNutritionPlanRef:
                  type: [object, "null"]
                activeWorkoutPlanRef:
                  type: [object, "null"]
                scheduledSessions:
                  type: array
                  items: { type: object }
                todaySummary:
                  type: object
                  description: Includes today nutrition (energy, protein, carbs, fat, fiber, and targets), server-authoritative hydration (targetCups, targetLiters, targetMl, boostMl, boostReason, clinicianGuided, guidanceCodes, bonuses, weeklyTargets), weight, activity, cardio, recovery, workout session, fastingState, ramadanMode, seasonalContext, cycleState, and maternalContext.
                streakSummary:
                  type: object
                engagementState:
                  type: object
                unreadCoachingInboxCount:
                  type: integer
                pendingAdaptations:
                  type: array
                  items: { type: object }
                workoutSafetyIssues:
                  type: array
                  items: { type: object }
                entitlements:
                  type: object
                  description: Active tier, features (including unlimited standard_plan_renewals for Free), and quotas (barcodeScansDailyLimit/Remaining = 3/day, mealCaptureMonthly = 3/month, specialistConsultationMonthly = 5/month, plus backward-compatible aliases).
                notificationPreferences:
                  type: object
    CoachingFeedbackPayload:
      oneOf:
        - properties:
            domain: {const: nutrition}
            barrier: {enum: [time, budget, taste, hunger, eating_out, logging, none]}
        - properties:
            domain: {const: training}
            barrier: {enum: [time, fatigue, pain, equipment, motivation, none]}
            hunger: {type: 'null'}
            satiety: {type: 'null'}
      type: object
      required: [domain, barrier]
      properties:
        domain:
          type: string
          enum: [nutrition, training]
        barrier:
          type: string
          enum: [time, budget, taste, hunger, eating_out, logging, fatigue, pain, equipment, motivation, none]
        hunger:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        satiety:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        energy:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
      description: Nutrition allows time/budget/taste/hunger/eating_out/logging/none; training allows time/fatigue/pain/equipment/motivation/none. Scores are optional 1 (low) to 5 (high). Hunger and satiety require nutrition. Server assigns current user-local date.
    CoachingDecisionPayload:
      type: object
      required: [id, accept]
      properties:
        id: {type: string}
        accept: {type: boolean}
    CoachingOutcomePayload:
      type: object
      required: [id, outcome]
      properties:
        id: {type: string}
        outcome:
          type: string
          enum: [helped, not_helped, not_tried]
    CoachingAckPayload:
      type: object
      required: [id]
      properties:
        id: {type: string}
    CoachingCase:
      type: object
      required: [id, domain, date, createdAt, context, status, title, step, evidence, planMutation]
      properties:
        id: {type: string}
        domain: {type: string, enum: [nutrition, training]}
        date: {type: string, format: date}
        createdAt: {type: string, format: date-time}
        context: {type: string}
        priorCaseId: {type: string}
        barrier: {type: [string, 'null']}
        status: {type: string, enum: [question, proposed, accepted, declined, completed, superseded]}
        title: {type: string}
        step: {type: string}
        evidence: {type: object}
        acknowledgedAt: {type: [string, 'null'], format: date-time}
        acceptedAt: {type: [string, 'null'], format: date-time}
        decidedAt: {type: string, format: date-time}
        closedAt: {type: string, format: date-time}
        reviewOn: {type: [string, 'null'], format: date}
        outcome:
          type: [object, 'null']
          properties:
            value: {type: string, enum: [helped, not_helped, not_tried]}
            source: {type: string, const: user_report}
            at: {type: string, format: date-time}
        planMutation: {type: boolean, const: false}
        reviewDue: {type: boolean}
        expired: {type: boolean}
        deliveryStatus: {type: string, const: NOT_SENT}
        readStatus: {type: string, enum: [ACKNOWLEDGED, UNKNOWN]}
    CoachingInbox:
      type: object
      required: [date, revision, channel, pushConfigured, items]
      properties:
        date: {type: string, format: date}
        revision: {type: integer}
        channel: {type: string, const: in_app}
        pushConfigured: {type: boolean}
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoachingCase'
    CommandRequest:
      allOf:
        - if:
            properties:
              action: {const: coaching_feedback}
          then:
            properties:
              payload: {$ref: '#/components/schemas/CoachingFeedbackPayload'}
        - if:
            properties:
              action: {const: coaching_decision}
          then:
            properties:
              payload: {$ref: '#/components/schemas/CoachingDecisionPayload'}
        - if:
            properties:
              action: {const: coaching_outcome}
          then:
            properties:
              payload: {$ref: '#/components/schemas/CoachingOutcomePayload'}
        - if:
            properties:
              action: {const: coaching_ack}
          then:
            properties:
              payload: {$ref: '#/components/schemas/CoachingAckPayload'}
      type: object
      required:
        - revision
        - action
        - payload
      properties:
        revision:
          type: integer
          minimum: 0
        action:
          type: string
          enum:
            - generate
            - confirm_health
            - confirm_schedule
            - renew_plan
            - food_entry
            - food_entry_batch
            - food_entry_update
            - food_delete
            - food_complete
            - food
            - food_switch_to_entries
            - replace_meal
            - food_favorite
            - recipe_save
            - recipe_delete
            - copy_meal
            - grocery_toggle
            - fasting_log
            - ramadan_mode
            - seasonal_flex
            - dining_out_log
            - post_feast_rebalance
            - weight
            - water
            - steps
            - activity
            - cycle_settings
            - cycle_log
            - cycle_gentle_session
            - recovery
            - workout
            - workout_delete
            - cardio_log
            - cardio_delete
            - session
            - session_delete
            - replace_exercise
            - ad_hoc_exercise
            - open_workout_session
            - workout_ui_mode
            - reschedule
            - comeback_restart
            - profile_update
            - body_measurement
            - streak_freeze
            - review
            - adaptation
            - timezone
            - notification_preferences
            - coaching_feedback
            - coaching_decision
            - coaching_outcome
            - coaching_ack
        payload:
          type: object
    CommandReceiptResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - revision
                - serverNow
                - serverDate
                - timezone
                - commandReceipt
                - affected
              properties:
                revision:
                  type: integer
                serverNow:
                  type: string
                  format: date-time
                serverDate:
                  type: string
                  format: date
                timezone:
                  type: string
                commandReceipt:
                  type: object
                  required:
                    - revision
                    - action
                    - replayed
                    - at
                  properties:
                    revision:
                      type: integer
                    action:
                      type: string
                    replayed:
                      type: boolean
                    at:
                      type: string
                      format: date-time
                newlyUnlockedBadges:
                  type: array
                  items: { type: object }
                affected:
                  type: array
                  items:
                    type: object
                    required:
                      - entityType
                      - entityId
                      - op
                    properties:
                      entityType:
                        type: string
                      entityId:
                        type: string
                      op:
                        type: string
                        enum:
                          - upsert
                          - delete
                      payload:
                        type: object
    FoodCatalogItem:
      type: object
      required:
        - id
        - key
        - name
        - status
        - reviewStatus
        - qualityTier
        - approvedForPlanning
        - values
        - source
      properties:
        id:
          type: string
        key:
          type: string
        planningKey:
          type:
            - string
            - "null"
        name:
          type: string
        name_ar:
          type: string
        name_en:
          type:
            - string
            - "null"
        state:
          type: string
        kind:
          type: string
        beverage:
          type: boolean
        status:
          type: string
          enum:
            - approved
            - estimated
        reviewStatus:
          type: string
          enum:
            - Approved
            - Pending Review
        qualityTier:
          type: string
        approvedForPlanning:
          description: True for an approved reference ingredient; estimated regional serving models remain false and expose isApproximate even when available in general meal plans.
          type: boolean
        isApproximate:
          type: boolean
        region:
          type: string
        basis:
          type: string
        basis_label:
          type: string
        values:
          type: object
          properties:
            energy:
              type:
                - string
                - "null"
            protein:
              type:
                - string
                - "null"
            fat:
              type:
                - string
                - "null"
            carbs:
              type:
                - string
                - "null"
            fiber:
              type:
                - string
                - "null"
            saturated:
              type:
                - string
                - "null"
            sodium:
              type:
                - string
                - "null"
            sugars:
              type:
                - string
                - "null"
        source:
          type: string
    FoodSearchResponse:
      type: object
      required:
        - items
        - total
        - offset
        - limit
        - nextOffset
        - coverageStatus
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FoodCatalogItem"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type:
            - integer
            - "null"
        coverageStatus:
          type: string
          enum:
            - verified_reference_available
            - mixed_verified_and_estimated
            - estimated_model_only_requires_specialist_review
            - missing_coverage
    PaginatedLogsResponse:
      type: object
      required:
        - total
        - offset
        - limit
        - nextOffset
        - items
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type:
            - integer
            - "null"
        items:
          type: array
          items:
            type: object
    SyncChangesResponse:
      type: object
      required:
        - items
        - deltas
        - currentRevision
        - nextCursor
        - nextSeqCursor
        - hasMore
        - resyncRequired
      properties:
        items:
          type: array
          items:
            type: object
        deltas:
          type: array
          items:
            type: object
            required:
              - seq
              - revision
              - entityType
              - entityId
              - op
              - at
              - payload
            properties:
              seq:
                type: integer
              revision:
                type: integer
              entityType:
                type: string
              entityId:
                type: string
              op:
                type: string
                enum:
                  - upsert
                  - delete
              at:
                type: string
                format: date-time
              payload:
                type: object
        currentRevision:
          type: integer
        nextCursor:
          type: integer
        nextSeqCursor:
          type: integer
        hasMore:
          type: boolean
        resyncRequired:
          type: boolean
    AuthRefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
          maxLength: 120
    AuthLogoutRequest:
      type: object
      properties:
        sessionId:
          type: string
        allDevices:
          type: boolean
    AuthUser:
      type: object
      required:
        - userId
        - email
        - entitlement
        - createdAt
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - "null"
        avatarUrl:
          type:
            - string
            - "null"
        entitlement:
          type: string
          enum:
            - free
            - pro
            - premium
        createdAt:
          type: string
          format: date-time
    AuthTokenResponse:
      type: object
      required:
        - tokenType
        - accessToken
        - expiresIn
        - expiresAt
        - refreshToken
        - refreshExpiresIn
        - refreshExpiresAt
        - sessionId
        - user
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
        refreshExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
