                      type: integer
                    action:
                      type: string
                    replayed:
                      type: boolean
                    at:
                      type: string
                      format: date-time
                affected:
                  type: array
                  items:
                    type: object
                    required:
                      - entityType
                      - entityId
                      - op
                    properties:
                      entityType:
                        type: string
                      entityId:
                        type: string
                      op:
                        type: string
                        enum:
                          - upsert
                          - delete
                      payload:
                        type: object
