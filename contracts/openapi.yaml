                parqRedFlag: { type: boolean }
                healthConfirmed: { type: boolean }
                unitSystem: { type: string, enum: [metric, imperial] }
                unit_system: { type: string, enum: [metric, imperial] }
                region: { type: string, enum: [egypt, gulf, levant, maghreb] }
                region_id: { type: string, enum: [egypt, gulf, levant, maghreb] }
