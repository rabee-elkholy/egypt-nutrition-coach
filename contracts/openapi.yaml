openapi: 3.1.0
info:
  title: CuraFit Backend API
  version: 1.0.0
  summary: REST API integration contract for Kotlin Multiplatform (KMM) Android & iOS clients on Cloudflare Workers + D1 + R2.
  description: |
    Canonical API contract for CuraFit (`v1`) on Cloudflare Workers + Cloudflare D1 + Cloudflare R2.
    - **Uniform Envelopes:** All `2xx` responses return `{ ok: true, data, meta: { requestId, serverTime, revision? } }`. All `4xx`/`5xx` responses return `{ ok: false, error: { code, message, params, fieldErrors, retryable, details? }, meta: { requestId, serverTime } }` with **100% English** error messages (`contracts/error-codes.json`) and canonical coaching codes (`contracts/coaching-codes.json`) for KMM mobile localization.
    - **Authentication (Cloudflare Native + Direct OIDC):** First-party email/password authentication via `POST /v1/auth/register`, `POST /v1/auth/login`, `POST /v1/auth/refresh`, `POST /v1/auth/logout`, plus direct Google/Apple OIDC verification via `POST /v1/auth/oauth/google` and `POST /v1/auth/oauth/apple`. Mobile KMM clients send `Authorization: Bearer <JWT>`.
    - **Idempotency:** All `POST /v1/commands` writes require a unique `Idempotency-Key` header (UUID) and `revision` integer. Canonical JSON hashing excludes `revision` so timeout + rebase replay succeeds cleanly.
    - **Slim Responses:** Append `?view=receipt` or send `Prefer: return=minimal` on `POST /v1/commands` to receive a compact delta receipt inside `data`.
    - **Deferred Final AI Phase:** AI routes (`POST /v1/nutrition/ai-parse`, `POST /v1/coaching/chat`, `GET /v1/coaching/chat/history`) are reserved for the final AI rollout phase and return `501 FEATURE_DEFERRED_TO_AI_PHASE`.
    - **Timezones & Dates:** Timestamps are `ISO-8601 UTC` (`YYYY-MM-DDTHH:mm:ss.sssZ`). Local calendar dates are `YYYY-MM-DD` evaluated in the user's configured IANA timezone (`Africa/Cairo`, `Asia/Riyadh`, `Asia/Dubai`, etc.).
  contact:
    name: CuraFit Platform Engineering
servers:
  - url: https://curafit-api-dev.egypt-nutrition-coach.workers.dev
    description: Cloudflare Cloud Dev Environment (dev branch, full production clone DB)
  - url: https://curafit-api.egypt-nutrition-coach.workers.dev
    description: Cloudflare Production Environment (main branch)
  - url: http://127.0.0.1:8787
    description: Local Miniflare / Wrangler Development Server
security:
  - BearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Public health and engine version check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, apiVersion, engineVersion, requestId]
                        properties:
                          status:
                            type: string
                          apiVersion:
                            type: string
                          engineVersion:
                            type: string
                          requestId:
                            type: string
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Runtime capabilities, schema version, catalog versions, and enabled feature flags
      security: []
      responses:
        "200":
          description: Runtime capabilities manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: Lightweight KMM startup payload (< 10 KB) with profile, active plan refs, today summary, and pending adaptations
      parameters:
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: Lightweight bootstrap payload
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "304":
          description: Not Modified (ETag matched)
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      description: Persist and resend the ETag returned by the server. It includes revision, local day and a short time bucket so recovery and date-dependent content expire. Do not construct it from revision alone.
  /v1/state:
    get:
      operationId: getFullState
      summary: Full account state including active nutrition/workout plans and logs (used by Web MVP and initial full sync)
      parameters:
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: Full account state
          content:
            application/json:
              schema:
                type: object
        "304":
          description: Not Modified
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /v1/commands:
    post:
      operationId: postCommand
      summary: Execute an idempotent domain mutation (generate, food_entry, water, weight, workout, session, recovery, review, adaptation, timezone, etc.)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 100
          description: Client-generated UUID for at-least-once retry safety
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
            enum:
              - return=minimal
              - return=representation
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum:
              - receipt
              - minimal
              - delta
              - full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: Command applied or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
            Idempotency-Replayed:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CommandReceiptResponse"
                  - type: object
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLargeError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /v1/foods:
    get:
      operationId: searchFoods
      summary: Search regional and reference foods with Arabic normalization and provenance metadata
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - all
              - approved
              - planning
              - beverages
            default: all
        - name: includeEstimated
          in: query
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Paginated food search results with coverage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSearchResponse"
  /v1/foods/{id}:
    get:
      operationId: getFoodDetail
      summary: Get full food item details, portions, provenance, and recipe formulation metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detailed food item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodCatalogItem"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/beverages:
    get:
      operationId: searchBeverages
      summary: Search prepared Egyptian, Ramadan, cafe, and fresh juice beverages
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: includeEstimated
          in: query
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Paginated beverage search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSearchResponse"
  /v1/foods/calculate:
    post:
      operationId: calculateRecipeOrBeverage
      summary: Calculate custom home/restaurant recipe or prepared beverage nutrients with density & cooking yield guardrails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Calculated nutrient profile with reviewStatus
          content:
            application/json:
              schema:
                type: object
  /v1/food-diary:
    get:
      operationId: getFoodDiaryDay
      summary: Get actual food entries, nullable nutrient totals, completion status, and target energy for a date
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily food diary summary
          content:
            application/json:
              schema:
                type: object
  /v1/water-logs:
    get:
      operationId: listWaterLogs
      summary: Paginated water intake logs ordered by date descending
      parameters:
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated water logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogsResponse"
  /v1/weight-logs:
    get:
      operationId: listWeightLogs
      summary: Paginated weight measurements ordered by date descending
      parameters:
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated weight logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogsResponse"
  /v1/workout-logs:
    get:
      operationId: listWorkoutLogs
      summary: Paginated exercise set/rep/load logs ordered by date descending
      parameters:
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated workout logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogsResponse"
  /v1/sessions:
    get:
      operationId: listWorkoutSessions
      summary: Paginated workout session completion logs
      parameters:
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated session logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogsResponse"
  /v1/checkins:
    get:
      operationId: listRecoveryCheckins
      summary: Paginated daily recovery check-ins (sleep, fatigue, stress, soreness, pain, redFlags)
      parameters:
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated recovery check-ins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogsResponse"
  /v1/plans:
    get:
      operationId: listNutritionPlans
      summary: List archived and active nutrition plan version references
      responses:
        "200":
          description: Nutrition plan references
          content:
            application/json:
              schema:
                type: object
  /v1/plans/{id}:
    get:
      operationId: getNutritionPlan
      summary: Get full owned nutrition plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full nutrition plan
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/plans/{id}/days/{date}:
    get:
      operationId: getNutritionPlanDay
      summary: Lazy-load a single day's meals and summary from an owned nutrition plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Single day nutrition plan detail
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/workout-plans:
    get:
      operationId: listWorkoutPlans
      summary: List owned workout plan version references
      responses:
        "200":
          description: Workout plan references
          content:
            application/json:
              schema:
                type: object
  /v1/workout-plans/{id}:
    get:
      operationId: getWorkoutPlan
      summary: Get full owned workout plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full workout plan
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/exercises:
    get:
      operationId: listExercises
      summary: Search and filter the 868 OpenExerciseDB catalog
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: muscle
          in: query
          schema:
            type: string
        - name: equipment
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated exercises (30 per page)
          content:
            application/json:
              schema:
                type: object
  /v1/exercises/{id}:
    get:
      operationId: getExerciseDetail
      summary: Get full exercise details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exercise detail
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFoundError"
  /v1/meal-alternatives:
    get:
      operationId: getMealAlternatives
      summary: Get up to 6 validated meal alternatives matching diet and clinical constraints
      parameters:
        - name: mealId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validated meal alternatives
          content:
            application/json:
              schema:
                type: object
  /v1/exercise-alternatives:
    get:
      operationId: getExerciseAlternatives
      summary: Get up to 6 injury-safe, time-budget-validated exercise alternatives
      parameters:
        - name: dayIndex
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 6
        - name: exerciseId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validated exercise alternatives
          content:
            application/json:
              schema:
                type: object
  /v1/progress/summary:
    get:
      operationId: getProgressSummary
      summary: 14-day weight trend, food completeness, hydration adherence, and workout progression insights
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                type: object
  /v1/coaching/inbox:
    get:
      operationId: getCoachingInbox
      summary: Active coaching agreements and review dates; reads never acknowledge messages
      responses:
        '200':
          description: In-app view; no external push delivery is implied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachingInbox'
  /v1/coaching/history:
    get:
      operationId: getCoachingHistory
      summary: Paginated coaching agreement history using date range and offset
      parameters:
        - $ref: '#/components/parameters/FromDateQuery'
        - $ref: '#/components/parameters/ToDateQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Owner-scoped agreement history; use nextOffset and refresh pagination after new writes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, minimum: 0}
                  offset: {type: integer, minimum: 0}
                  limit: {type: integer, minimum: 1, maximum: 100}
                  nextOffset: {type: [integer, 'null']}
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoachingCase'
  /v1/coaching/brief:
    get:
      operationId: getCoachingBrief
      summary: Deterministic personal follow-up for KMM without duplicating JavaScript rules
      description: |
        On-demand nutrition, training and follow-up view based on recorded account data.
        IDs remain stable per account namespace, local day and role; refresh the note when revision/content changes.
        This endpoint does not persist notifications or imply delivery, rendering, reading or actioning.
        Unonboarded accounts return requiresOnboarding=true and no notes.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description: Current personalized coaching view
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingBriefResponse"
        "304":
          description: Not Modified; no delivery or rendering acknowledgement implied
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/eligibility:
    post:
      operationId: evaluateEligibility
      summary: Pre-onboarding clinical and physiological screening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                type: object
  /v1/sync/changes:
    get:
      operationId: getSyncChanges
      summary: Paginated change feed with entity-level upserts, delete tombstones, and monotonic sync cursor
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: afterSeq
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Change feed and entity deltas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncChangesResponse"
  /v1/auth/register:
    post:
      operationId: registerAuthUser
      summary: Register a new user account on Cloudflare D1 and issue Access JWT + rotating Refresh Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User registered and session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /v1/auth/login:
    post:
      operationId: loginAuthUser
      summary: Authenticate with email and password on Cloudflare D1 and issue Access JWT + Refresh Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /v1/auth/refresh:
    post:
      operationId: refreshAuthToken
      summary: Rotate an active Refresh Token and issue a fresh Access JWT + Refresh Token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: Session refreshed and token rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      summary: Revoke current device session (or all devices) and invalidate associated refresh tokens
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
      responses:
        "200":
          description: Logged out cleanly
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /v1/auth/change-password:
    post:
      operationId: changeAuthPassword
      summary: Verify current password, update PBKDF2-SHA256 hash in D1, and optionally revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Inspect current authenticated session, subject, scopes, and entitlement tier
      responses:
        "200":
          description: Active session info
          content:
            application/json:
              schema:
                type: object
  /v1/auth/revoke:
    post:
      operationId: revokeAuthSession
      summary: Revoke current device session or all sessions across devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                allDevices:
                  type: boolean
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
  /v1/auth/claim-anonymous:
    post:
      operationId: claimAnonymousAccount
      summary: Explicitly migrate/claim an anonymous trial account into a verified KMM user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - anonymousUserId
                - consent
              properties:
                anonymousUserId:
                  type: string
                consent:
                  type: boolean
                mergeStrategy:
                  type: string
                  enum:
                    - fail_if_not_empty
                    - overwrite_empty
      responses:
        "200":
          description: Anonymous data claimed and transferred
          content:
            application/json:
              schema:
                type: object
        "409":
          $ref: "#/components/responses/ConflictError"
      description: Requires a verified bearer token and the owning coach_uid cookie. The public gateway derives proof from the cookie; a client-supplied internal identity header is never trusted. Transfer is atomic and cannot overwrite an existing profile.
  /v1/account/export:
    get:
      operationId: exportAccountData
      summary: Export full machine-readable user profile, logs, archived plans, and consent records
      responses:
        "200":
          description: Full account JSON export
          content:
            application/json:
              schema:
                type: object
  /v1/account/delete:
    post:
      operationId: deleteAccountData
      summary: Erase account data and revoke all sessions
      description: Atomically clears all account tables and legacy claimed anonymous namespaces within one database batch. Revocation tombstones remain to reject old tokens and concurrent writes.
      requestBody: &a1
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirm
              properties:
                confirm:
                  type: boolean
      responses: &a2
        "200":
          description: Account permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "415":
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Database or required revocation schema unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteAccountUsingDelete
      summary: Erase account data and revoke all sessions
      description: Same atomic erasure scope as POST /v1/account/delete.
      requestBody: *a1
