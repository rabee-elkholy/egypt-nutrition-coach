components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AnonymousCookieAuth:
      type: apiKey
      in: cookie
      name: coach_uid
  parameters:
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    FromDateQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    ToDateQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  responses:
    ValidationError:
      description: Validation or domain rule error (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Unauthenticated or token expired/revoked (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: Resource not found or not owned by caller (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictError:
      description: Optimistic concurrency revision mismatch or idempotency key conflict (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLargeError:
      description: Request body > 40 KB or account capacity reached (413)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimitedError:
      description: Per-user rate limit exceeded (429)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CoachingBriefResponse:
      type: object
      required: [apiVersion, viewKind, date, timezone, revision, generatedAt, requiresOnboarding, notes, requestId]
      properties:
        apiVersion:
          type: string
          const: "1"
        viewKind:
          type: string
          const: on_demand_coaching_brief
        date:
          type: string
          format: date
        timezone:
          type: string
        revision:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time
        requiresOnboarding:
          type: boolean
        requestId:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/CoachingBriefNote"
    CoachingBriefNote:
      type: object
      required: [id, role, key, priority, text, action, basedOnRevision, relatedPlanId, status, deliveryStatus, renderingStatus]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [nutrition, training, followup]
        key:
          type: string
        priority:
          type: string
          enum: [normal, attention, urgent]
        text:
          type: string
        action:
          type: string
        actionTarget:
          type: string
          enum: [recovery, food, feedback, workout]
          description: Optional navigation destination for the in-app first-week next step; never performs a write.
        basedOnRevision:
          type: integer
          minimum: 0
        relatedPlanId:
          type: [string, "null"]
        status:
          type: string
          const: GENERATED
        deliveryStatus:
          type: string
          const: NOT_MEASURED
        caseId:
          type: string
          description: Optional related persisted coaching agreement ID
        renderingStatus:
          type: string
          const: NOT_MEASURED
    AccountDeletionResponse:
      type: object
      required: [deleted, userId, deletedAt, tablesCleared, namespacesCleared]
      properties:
        deleted:
          type: boolean
          const: true
        userId:
          type: string
        deletedAt:
          type: string
          format: date-time
        tablesCleared:
          type: integer
          minimum: 1
        namespacesCleared:
          type: integer
          minimum: 1
    SuccessMeta:
      type: object
      required: [requestId, serverTime]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        revision:
          type: integer
    SuccessEnvelope:
      type: object
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    ErrorEnvelope:
      type: object
      required: [ok, error, meta]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message, params, fieldErrors, retryable]
          properties:
            code:
              type: string
              description: Stable machine-readable error code (`contracts/error-codes.json`) for client localization.
            message:
              type: string
              description: English fallback error message (zero Arabic characters).
            params:
              type: object
              additionalProperties: true
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    CapabilitiesResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - apiVersion
                - schemaVersion
                - engineVersion
                - coachingCodesVersion
                - catalogVersion
                - serverTime
                - requestId
                - auth
                - features
                - deferredFeatures
              properties:
                apiVersion:
                  type: string
                schemaVersion:
                  type: integer
                engineVersion:
                  type: string
                coachingCodesVersion:
                  type: string
                catalogVersion:
                  type: string
                foodCatalogVersion:
                  type: string
                serverTime:
                  type: string
                  format: date-time
                requestId:
                  type: string
                minSupportedVersion:
                  type: object
                  properties:
                    android: { type: string }
                    ios: { type: string }
                maintenanceMode:
                  type: object
                  properties:
                    active: { type: boolean }
                    message: { type: [string, "null"] }
                auth:
                  type: object
                  properties:
