                ifStartHour: { type: integer, minimum: 6, maximum: 16, description: Eating window start hour (06:00..16:00) for intermittent fasting. }
                carbCycling: { type: boolean, description: Optional opt-in carb cycling (+10% calories/carbs on training days, -5% on rest days, preserving daily protein). }
                batchPrepMode: { type: boolean, description: Optional batch meal preparation preference. }
                excludedGroups: { type: array, items: { type: string } }
